name: B13UpdateTemp

on: [push]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/bloco13-memoria-continuidade'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bloco13-memoria-continuidade
          fetch-depth: 0
      - name: Apply B13 integration
        run: python tools/_b13_update_temp.py
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No B13 integration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/mind.py database/cognitive_store.py core/star_core.py STAR_MIND_MANIFEST.json docs/MASTER_ROADMAP.md
          git commit -m "feat(memory): integrate B13 memory continuity with STAR Core"
          git push origin HEAD:feat/bloco13-memoria-continuidade
