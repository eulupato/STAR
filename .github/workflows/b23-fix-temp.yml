name: B23FixTemp
on: [push]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/bloco23-global-workspace'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bloco23-global-workspace
          fetch-depth: 0
      - run: python tools/_b23_fix_temp.py
      - shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/global_workspace.py
          git commit -m "fix(workspace): preserve candidate fields after attention selection"
          git push origin HEAD:feat/bloco23-global-workspace
