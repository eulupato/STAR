name: STAR Watch Android

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "clients/star_watch_android/**"
      - ".github/workflows/star-watch-android.yml"
      - "core/device_gateway.py"
      - "core/device_runtime.py"
      - "STAR_MANIFEST.json"
  push:
    branches: [main, feature/star-watch-v0]
    paths:
      - "clients/star_watch_android/**"
      - ".github/workflows/star-watch-android.yml"
      - "core/device_gateway.py"
      - "core/device_runtime.py"
      - "STAR_MANIFEST.json"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted runners expose the Android SDK, but sdkmanager is not
      # guaranteed to be on PATH. Resolve it from the SDK root instead of
      # depending on the removed legacy "tools" package.
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build STAR Watch debug APK
        run: gradle -p clients/star_watch_android :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: star-watch-debug-apk
          path: clients/star_watch_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
