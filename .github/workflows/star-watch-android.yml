name: STAR Watch Android

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "clients/star_watch_android/**"
      - ".github/workflows/star-watch-android.yml"
  push:
    branches: [main, feature/star-watch-v0]
    paths:
      - "clients/star_watch_android/**"
      - ".github/workflows/star-watch-android.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build STAR Watch debug APK
        run: gradle -p clients/star_watch_android :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: star-watch-debug-apk
          path: clients/star_watch_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
