name: STAR Watch Android

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "clients/star_watch_android/**"
      - ".github/workflows/star-watch-android.yml"
      - "core/device_gateway.py"
      - "core/device_runtime.py"
      - "STAR_MANIFEST.json"
  push:
    branches: [main, feature/star-watch-v0]
    paths:
      - "clients/star_watch_android/**"
      - ".github/workflows/star-watch-android.yml"
      - "core/device_gateway.py"
      - "core/device_runtime.py"
      - "STAR_MANIFEST.json"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # O runner já fornece Android SDK/cmdline-tools. Evitamos solicitar o
      # pacote legado "tools", removido dos repositórios recentes do SDK.
      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build STAR Watch debug APK
        run: gradle -p clients/star_watch_android :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: star-watch-debug-apk
          path: clients/star_watch_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
