name: STAR Windows smoke

on:
  push:
    branches: [main, v2.0-development]
  pull_request:
    branches: [main]

jobs:
  windows-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile project
        run: python -m compileall -q core gui voice modules database tests main.py config.py diagnostico.py

      - name: Run test suite
        run: pytest -q tests

      - name: Run lightweight STAR diagnostic
        run: python diagnostico.py
