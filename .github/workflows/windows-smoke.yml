name: STAR Windows smoke

on:
  push:
    branches: [main, v2.0-development, v3.0-knowledge]
  pull_request:
    branches: [main, v2.0-development, v3.0-knowledge]

jobs:
  windows-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-media.txt

      - name: Validate optional STAR TV backend
        run: python -c "import webview; print('pywebview OK')"

      - name: Compile project
        run: python -m compileall -q core gui knowledge voice modules database tests tools main.py config.py diagnostico.py

      - name: Run test suite
        run: pytest -q tests

      - name: Run lightweight STAR diagnostic
        run: python diagnostico.py
