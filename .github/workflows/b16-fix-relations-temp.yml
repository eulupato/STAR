name: B16FixRelationsTemp

on: [push]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/bloco16-cognicao-social'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bloco16-cognicao-social
          fetch-depth: 0
      - name: Apply B16 relations coverage fix
        run: python tools/_b16_fix_relations_temp.py
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No B16 relation changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/social_cognition.py
          git commit -m "fix(social): cover relations explicitly in B16 taxonomy"
          git push origin HEAD:feat/bloco16-cognicao-social
