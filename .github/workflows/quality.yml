name: STAR quality

on:
  push:
    branches: [main, v1.9-development, v2.0-development, v1.9-stability-audit-20260831]
  pull_request:
    branches: [main, v2.0-development]

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - name: Compile project
        run: python -m compileall -q core gui voice modules database tests main.py config.py diagnostico.py
      - name: Run full test suite
        run: pytest -q tests
