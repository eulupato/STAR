name: STAR quality

on:
  push:
    branches: [main, v1.9-development]
  pull_request:
    branches: [main]

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - name: Compile project
        run: python -m compileall -q core gui voice modules database main.py config.py
      - name: Run voice pipeline smoke tests
        run: pytest -q tests/test_voice_pipeline.py
