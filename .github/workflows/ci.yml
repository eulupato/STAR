name: STAR CI

on:
  push:
    branches: [ main, v1.9-development ]
  pull_request:
    branches: [ main ]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate Python syntax
        run: python -m compileall -q core gui modules voice database tests
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              if any(part in {'.git', '.venv', '.voice_venv', 'models'} for part in path.parts):
                  continue
              json.loads(path.read_text(encoding='utf-8'))
          print('JSON OK')
          PY
