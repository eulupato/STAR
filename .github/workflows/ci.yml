name: STAR CI

on:
  push:
    branches: [main, v1.9-development, v2.0-development, v1.9-stability-audit-20260831]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate Python syntax
        run: python -m compileall -q core gui modules voice database tests main.py config.py diagnostico.py
      - name: Validate project JSON manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [Path('config_skin.json'), *sorted(Path('.').glob('STAR_*MANIFEST.json'))]
          for root in (Path('knowledge/m_drives'), Path('knowledge/packs')):
              if root.is_dir():
                  files.extend(sorted(root.glob('*/manifest.json')))

          unique = []
          seen = set()
          for path in files:
              key = path.as_posix()
              if key not in seen:
                  seen.add(key)
                  unique.append(path)

          if not unique:
              raise SystemExit('nenhum manifesto JSON encontrado')

          for path in unique:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'OK {path}')
          print(f'JSON manifests OK: {len(unique)} arquivo(s)')
          PY
