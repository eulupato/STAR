name: STAR CI

on:
  push:
    branches: [main, v1.9-development, v2.0-development, v1.9-stability-audit-20260831]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate Python syntax
        run: python -m compileall -q core gui modules voice database tests main.py config.py diagnostico.py
      - name: Repository hygiene and JSON validation
        run: python tools/repo_hygiene.py
