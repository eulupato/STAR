name: B25FixTemp
on: [push]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/bloco25-percepcao-multimodal'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bloco25-percepcao-multimodal
          fetch-depth: 0
      - run: python tools/_b25_fix_temp.py
      - shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/multimodal_perception.py
          git commit -m "fix(perception): preserve singleton entities and fusion provenance"
          git push origin HEAD:feat/bloco25-percepcao-multimodal
