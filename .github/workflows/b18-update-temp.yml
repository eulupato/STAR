name: B18UpdateTemp

on: [push]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/bloco18-raciocinio-simulacao'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bloco18-raciocinio-simulacao
          fetch-depth: 0
      - name: Apply B18 integration
        run: python tools/_b18_update_temp.py
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No B18 integration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/star_core.py STAR_MIND_MANIFEST.json docs/MASTER_ROADMAP.md
          git commit -m "feat(reasoning): integrate B18 reasoning and simulation with STAR Core"
          git push origin HEAD:feat/bloco18-raciocinio-simulacao
