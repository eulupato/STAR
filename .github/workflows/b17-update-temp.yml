name: B17UpdateTemp

on: [push]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/bloco17-afeto-personalidade'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bloco17-afeto-personalidade
          fetch-depth: 0
      - name: Apply B17 integration
        run: python tools/_b17_update_temp.py
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No B17 integration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/cognitive_store.py core/star_core.py STAR_MIND_MANIFEST.json docs/MASTER_ROADMAP.md
          git commit -m "feat(personality): integrate B17 persistence with STAR Core"
          git push origin HEAD:feat/bloco17-afeto-personalidade
