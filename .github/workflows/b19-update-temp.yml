name: B19UpdateTemp

on: [push]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/bloco19-planejamento-decisao'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bloco19-planejamento-decisao
          fetch-depth: 0
      - name: Apply B19 integration
        run: python tools/_b19_update_temp.py
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No B19 integration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/planning_decision.py core/star_core.py STAR_MIND_MANIFEST.json docs/MASTER_ROADMAP.md
          git commit -m "feat(planning): integrate B19 planning and decision with STAR Core"
          git push origin HEAD:feat/bloco19-planejamento-decisao
