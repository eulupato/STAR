name: B10DocsTemp

on: [push]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Update docs
        run: python tools/_b10_docs_temp.py
      - name: Commit docs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No documentation changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STAR_MIND_MANIFEST.json docs/MASTER_ROADMAP.md
          git commit -m "docs(mind): register B10 human contexts"
          git push origin HEAD:${{ github.ref_name }}
