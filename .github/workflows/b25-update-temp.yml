name: B25UpdateTemp
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/bloco25-percepcao-multimodal'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bloco25-percepcao-multimodal
          fetch-depth: 0
      - run: python tools/_b25_update_temp.py
      - shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/global_workspace.py core/mind_loop.py core/star_core.py STAR_MIND_MANIFEST.json docs/MASTER_ROADMAP.md
          git commit -m "feat(perception): integrate B25 with Workspace and Mind Loop"
          git push origin HEAD:feat/bloco25-percepcao-multimodal
