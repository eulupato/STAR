name: B16UpdateTemp

on: [push]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/bloco16-cognicao-social'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bloco16-cognicao-social
          fetch-depth: 0
      - name: Apply B16 integration
        run: python tools/_b16_update_temp.py
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No B16 integration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/star_core.py STAR_MIND_MANIFEST.json docs/MASTER_ROADMAP.md
          git commit -m "feat(social): integrate B16 social cognition with STAR Core"
          git push origin HEAD:feat/bloco16-cognicao-social
