name: B17FixAdaptiveLabelTemp

on: [push]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/bloco17-afeto-personalidade'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bloco17-afeto-personalidade
          fetch-depth: 0
      - name: Apply adaptive label fix
        run: python tools/_b17_fix_adaptive_label_temp.py
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No B17 adaptive label changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/affective_personality.py
          git commit -m "fix(personality): represent adaptive personality explicitly"
          git push origin HEAD:feat/bloco17-afeto-personalidade
