name: B22UpdateTemp
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/bloco22-knowledge-integration'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bloco22-knowledge-integration
          fetch-depth: 0
      - run: python tools/_b22_update_temp.py
      - shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/star_core.py STAR_MIND_MANIFEST.json docs/MASTER_ROADMAP.md
          git commit -m "feat(knowledge): integrate B22 with STAR Core"
          git push origin HEAD:feat/bloco22-knowledge-integration
