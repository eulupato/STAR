name: B15UpdateTemp

on: [push]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/bloco15-cinco-modelos-internos'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bloco15-cinco-modelos-internos
          fetch-depth: 0
      - name: Apply B15 integration
        run: python tools/_b15_update_temp.py
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No B15 integration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/self_model.py core/star_core.py STAR_MIND_MANIFEST.json docs/MASTER_ROADMAP.md
          git commit -m "feat(models): integrate B15 five internal models with STAR Core"
          git push origin HEAD:feat/bloco15-cinco-modelos-internos
