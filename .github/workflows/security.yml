name: STAR security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "maintenance/**"]
  schedule:
    - cron: "17 12 * * 1"

permissions:
  contents: read

jobs:
  dependency-and-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip_audit -r requirements.txt

      - name: Scan repository for common committed secret formats
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('core'), Path('gui'), Path('modules'), Path('voice'),
              Path('database'), Path('tests'), Path('clients'), Path('docs'),
          ]
          patterns = {
              'GitHub token': re.compile(r'gh[pousr]_[A-Za-z0-9]{30,}'),
              'OpenAI-style secret': re.compile(r'\bsk-[A-Za-z0-9_-]{20,}\b'),
              'AWS access key': re.compile(r'\bAKIA[0-9A-Z]{16}\b'),
              'private key block': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
          }
          suffixes = {'.py', '.md', '.txt', '.json', '.yml', '.yaml', '.swift', '.java', '.xml', '.gradle', '.bat'}
          findings = []

          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in suffixes:
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  for label, pattern in patterns.items():
                      if pattern.search(text):
                          findings.append(f'{label}: {path}')

          if findings:
              raise SystemExit('\n'.join(f'- {item}' for item in findings))
          print('Common secret-format scan OK')
          PY
