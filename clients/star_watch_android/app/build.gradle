plugins {
    id 'com.android.application'
}

android {
    namespace 'com.star.watch'
    compileSdk 35

    defaultConfig {
        applicationId 'com.star.watch'
        minSdk 27
        targetSdk 28
        versionCode 3
        versionName '0.3.0'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
